name: Build & Release

# - Every push / PR: compiles both builds so you know it still builds.
# - Pushing a tag like v1.0.0: builds, publishes a GitHub release with both zips,
#   and updates manifest.json on the default branch (the URL you add to Jellyfin).
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - jellyfin: 10.11.11
            dotnet: 9.0.x
            targetAbi: 10.11.0.0
            abiSuffix: 10
          - jellyfin: 12.1.0
            dotnet: 10.0.x
            targetAbi: 12.1.0.0
            abiSuffix: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Work out version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            base="${GITHUB_REF#refs/tags/v}"
          else
            base="0.0.0"
          fi
          # 1.2.3 -> 1.2.3.<abiSuffix>, so 12.x servers always pick the 12.x build.
          echo "version=${base}.${{ matrix.abiSuffix }}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: >
          dotnet build src/Jellyfin.Plugin.WatchedTogether/Jellyfin.Plugin.WatchedTogether.csproj
          -c Release
          -p:JellyfinVersion=${{ matrix.jellyfin }}
          -p:Version=${{ steps.ver.outputs.version }}
          -p:AssemblyVersion=${{ steps.ver.outputs.version }}
          -p:FileVersion=${{ steps.ver.outputs.version }}
          -o build-out

      - name: Package
        run: >
          python3 scripts/package.py zip
          --dll build-out/Jellyfin.Plugin.WatchedTogether.dll
          --version ${{ steps.ver.outputs.version }}
          --target-abi ${{ matrix.targetAbi }}
          --owner "${{ github.repository_owner }}"
          --changelog "See release notes"
          --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.abiSuffix }}
          path: dist/*.zip

  tizen-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package the hosted Samsung TV app (unsigned .wgt; the installer signs it)
        run: |
          mkdir -p dist
          cd tizen-app && zip -r -X ../dist/Jellyfin-Plus-Tizen.wgt . -x '.*'

      - uses: actions/upload-artifact@v4
        with:
          name: tizen-app
          path: dist/Jellyfin-Plus-Tizen.wgt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, tizen-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.zip dist/*.wgt --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/*.wgt \
              --title "Watched Together ${GITHUB_REF_NAME}" \
              --generate-notes
          fi

      - name: Update manifest.json
        shell: bash
        run: |
          base="${GITHUB_REF_NAME#v}"
          for pair in "10:10.11.0.0" "12:12.1.0.0"; do
            suffix="${pair%%:*}"; abi="${pair#*:}"
            version="${base}.${suffix}"
            zip="dist/watched-together_${version}.zip"
            python3 scripts/package.py manifest \
              --manifest manifest.json \
              --zip "$zip" \
              --version "$version" \
              --target-abi "$abi" \
              --owner "${{ github.repository_owner }}" \
              --changelog "Release ${GITHUB_REF_NAME}" \
              --source-url "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/watched-together_${version}.zip"
          done

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Update manifest for ${GITHUB_REF_NAME}" || echo "No manifest changes"
          git push
